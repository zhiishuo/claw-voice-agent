<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>知识库测试</title>
  <link rel="stylesheet" href="/static/pages/knowledge-test/knowledge-test.css" />
</head>
<body>
  <main class="kb-page">
    <header class="kb-hero">
      <div>
        <p class="kb-eyebrow">Knowledge Base Lab</p>
        <h1>知识库测试</h1>
        <p class="kb-subtitle">用于单独检查知识库状态和检索结果，不影响当前语音工作台会话。</p>
      </div>
      <a class="kb-back" href="/">返回工作台</a>
    </header>

    <section class="kb-card kb-card--status">
      <div>
        <h2>连接信息</h2>
        <p id="statusText">等待检测</p>
      </div>
      <button id="refreshStatusBtn" type="button">刷新状态</button>
    </section>

    <section class="kb-card">
      <label class="kb-label" for="queryInput">测试问题</label>
      <textarea id="queryInput" placeholder="例如：南方8900请求起飞，需要检索哪些知识？"></textarea>
      <div class="kb-form-row">
        <label>
          返回条数
          <input id="topKInput" type="number" min="1" max="20" value="5" />
        </label>
        <label>
          检索模式
          <input id="modeInput" type="text" placeholder="留空使用默认模式" />
        </label>
        <button id="searchBtn" class="kb-primary" type="button">开始检索</button>
      </div>
    </section>

    <section class="kb-card">
      <div class="kb-results-head">
        <div>
          <h2>检索结果</h2>
          <div class="kb-view-tabs" role="tablist" aria-label="检索结果视图">
            <button class="kb-view-tab active" type="button" data-result-view="list">检索结果</button>
            <button class="kb-view-tab" type="button" data-result-view="visual">检索结果可视化</button>
          </div>
        </div>
        <span id="resultMeta">暂无结果</span>
      </div>
      <div id="resultList" class="kb-results"></div>
      <div id="visualizationPanel" class="kb-visual hidden"></div>
    </section>
  </main>

  <script type="module" src="/static/pages/knowledge-test/knowledge-test.js"></script>
</body>
</html>
